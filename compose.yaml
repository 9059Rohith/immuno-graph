name: immunograph

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3001
      MCP_TRANSPORT_TYPE: dual
      IEDB_LIVE_ENABLED: ${IEDB_LIVE_ENABLED:-false}
      MHCFLURRY_ENABLED: ${MHCFLURRY_ENABLED:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
      DOCKING_PROVIDER_URL: ${DOCKING_PROVIDER_URL:-}
      DOCKING_PROVIDER_TOKEN: ${DOCKING_PROVIDER_TOKEN:-}
      DOCKING_ENGINE_NAME: ${DOCKING_ENGINE_NAME:-external-provider}
      DOCKING_ENGINE_VERSION: ${DOCKING_ENGINE_VERSION:-}
    expose:
      - '3001'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: file:/data/immunograph.db
      ARTIFACT_ROOT: /data/artifacts
      MCP_SERVER_URL: http://mcp:3001/mcp
      DEMO_MODE: ${DEMO_MODE:-true}
      LLM_ENABLED: 'false'
    volumes:
      - immunograph-data:/data
    depends_on:
      mcp:
        condition: service_healthy
    expose:
      - '3000'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    ports:
      - '${IMMUNOGRAPH_PORT:-8080}:8080'
    restart: unless-stopped

volumes:
  immunograph-data:
