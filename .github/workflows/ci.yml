name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs:check
      - run: npm run deployment:check

  judge-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=judge-chromium

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file Dockerfile.mcp --tag immunograph-mcp:ci .
      - run: docker build --file Dockerfile.api --tag immunograph-api:ci .
      - run: docker network create immunograph-ci
      - run: docker run --detach --name immunograph-mcp --network immunograph-ci immunograph-mcp:ci
      - run: |
          for attempt in {1..30}; do
            if docker exec immunograph-mcp curl --fail --silent http://127.0.0.1:3001/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs immunograph-mcp
          exit 1
      - run: >-
          docker run --detach --name immunograph-api --network immunograph-ci
          --env CORS_ORIGINS=http://localhost:4173
          --env MCP_SERVER_URL=http://immunograph-mcp:3001/mcp
          immunograph-api:ci
      - run: |
          for attempt in {1..30}; do
            if docker exec immunograph-api curl --fail --silent http://127.0.0.1:3000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs immunograph-api
          exit 1
